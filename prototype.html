<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Line Chart Prototype — Visual Review</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, sans-serif;
        line-height: 1.5;
        color: #213547;
        background-color: #f8f9fa;
      }

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 1rem;
      }

      h1 {
        color: #213547;
        font-size: 1.2rem;
        font-weight: 500;
        margin-bottom: 0.5rem;
        opacity: 0.7;
      }

      .instructions {
        color: #555;
        font-size: 0.8rem;
        margin-bottom: 1rem;
        text-align: center;
      }

      .canvas-container {
        position: relative;
        width: 100%;
        max-width: 1200px;
        height: 600px;
        background: #ffffff;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid #e0e0e0;
      }

      .canvas-container canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      /* Tooltip */
      .tooltip {
        position: absolute;
        pointer-events: none;
        color: #ffffff;
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 0.75rem;
        border: 1px solid rgba(0, 0, 0, 0.08);
        box-shadow: 0 3px 14px rgba(0, 0, 0, 0.2);
        display: none;
        z-index: 100;
        max-width: 340px;
        min-width: 180px;
      }

      .tooltip--has-embed {
        /* Not used anymore — tooltip is always non-interactive */
      }

      .tooltip-click-hint {
        margin-top: 6px;
        font-size: 0.6rem;
        color: rgba(255, 255, 255, 0.5);
        text-align: center;
      }
      .tooltip-embed {
        margin-top: 10px;
        border-radius: 6px;
        overflow: hidden;
      }

      .tooltip-embed--video {
        background: #000;
        aspect-ratio: 16/9;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        opacity: 0.6;
        color: #fff;
      }

      .tooltip-embed--apple {
        background: #fafafa;
        border: 1px solid rgba(255,255,255,0.2);
        height: 180px;
        overflow-y: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: #666;
        font-size: 0.7rem;
      }

      .tooltip-date-row {
        font-size: 0.7rem;
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .tooltip-event-badge {
        font-weight: 600;
        color: #ffffff;
      }

      .tooltip-logo {
        width: 40px;
        height: 40px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        background: rgba(255, 255, 255, 0.2);
      }

      .tooltip-logo img {
        width: 32px;
        height: 32px;
        object-fit: contain;
        filter: brightness(0) invert(1);
      }

      .tooltip-logo-initials {
        font-size: 0.9rem;
        font-weight: 700;
        color: white;
      }

      .tooltip-artist-name {
        font-weight: 600;
        font-size: 0.85rem;
        margin-bottom: 2px;
      }

      .tooltip-meta {
        font-size: 0.65rem;
        color: rgba(255, 255, 255, 0.6);
        margin-bottom: 6px;
      }

      .tooltip-song {
        font-size: 0.75rem;
        margin-bottom: 2px;
      }

      .tooltip-stats {
        font-size: 0.7rem;
        color: rgba(255, 255, 255, 0.8);
        font-weight: 500;
      }

      /* Disambiguation popup */
      .disambiguation {
        position: absolute;
        background: rgba(255, 255, 255, 0.97);
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 8px;
        padding: 4px 0;
        font-size: 0.8rem;
        display: none;
        z-index: 200;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        min-width: 160px;
        max-height: 280px;
        overflow-y: auto;
      }

      .disambiguation-item {
        padding: 6px 12px;
        color: #213547;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .disambiguation-item:hover {
        background: rgba(0, 0, 0, 0.05);
      }

      .disambiguation-item .color-swatch {
        width: 12px;
        height: 3px;
        border-radius: 2px;
        flex-shrink: 0;
      }

      /* Popover — styled same as tooltip, but interactive (click to engage) */
      .popover {
        position: absolute;
        pointer-events: auto;
        color: #ffffff;
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 0.75rem;
        border: 1px solid rgba(0, 0, 0, 0.08);
        box-shadow: 0 3px 14px rgba(0, 0, 0, 0.2);
        display: none;
        z-index: 300;
        max-width: 340px;
        min-width: 180px;
      }

      /* Legend */
      .legend {
        margin-top: 1rem;
        display: flex;
        gap: 1.5rem;
        flex-wrap: wrap;
        justify-content: center;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #555;
        font-size: 0.75rem;
      }

      .legend-swatch {
        width: 20px;
        height: 3px;
        border-radius: 2px;
      }

      .legend-dot {
        width: 10px;
        height: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.6rem;
      }
    </style>
  </head>
  <body>
    <h1>Line Chart Visual Prototype</h1>
    <p class="instructions">
      Hover lines to see tooltip. Click a line to highlight (others dim). Click a dot for popover. Click empty space to deselect.
    </p>
    <div class="canvas-container" id="container">
      <canvas id="bg-canvas"></canvas>
      <canvas id="fg-canvas"></canvas>
      <canvas id="hl-canvas"></canvas>
      <div class="tooltip" id="tooltip"></div>
      <div class="disambiguation" id="disambiguation"></div>
      <div class="popover" id="popover"></div>
    </div>
    <div class="legend" id="legend"></div>
    <script type="module" src="/src/prototype/main.ts"></script>
  </body>
</html>
